openapi: 3.0.3
info:
  title: Social Network API
  version: 1.0.0
  description: API đăng nhập, làm mới token và xem bài viết

paths:
  /auth/login:
    post:
      summary: Đăng nhập
      operationId: login
      description: Đăng nhập bằng email và mật khẩu
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
                  writeOnly: true
            example:
              email: dung@example.com
              password: example-password
      responses:
        '200':
          $ref: '#/components/responses/Tokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email hoặc mật khẩu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unauthorized

  /auth/refresh:
    post:
      summary: Làm mới token
      operationId: refreshToken
      description: |
        Không yêu cầu scope. Yêu cầu refresh token hợp lệ
        Token được gửi qua header Authorization theo dạng Bearer
        Refresh token cũ bị vô hiệu khi cấp cặp token mới
        Access token mới sử dụng quyền hiện tại của người dùng
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Tokens'
        '401':
          description: Thiếu refresh token, token sai, hết hạn hoặc đã bị thu hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unauthorized

  /posts/{id}:
    get:
      summary: Xem bài viết
      operationId: getPost
      description: |
        Yêu cầu access token hợp lệ và scope posts:read
        Người có scope được xem bài public
        Bài private chỉ cho tác giả xem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                required: [id, author_id, content, visibility]
                additionalProperties: false
                properties:
                  id:
                    type: integer
                  author_id:
                    type: integer
                  content:
                    type: string
                  visibility:
                    type: string
                    enum: [public, private]
              example:
                id: 1
                author_id: 42
                content: Bài viết đầu tiên
                visibility: private
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Thiếu access token, token sai, hết hạn hoặc đã bị thu hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unauthorized
        '403':
          description: Thiếu scope posts:read hoặc không được xem bài private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: forbidden
        '404':
          description: Không tìm thấy bài viết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: post_not_found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Xác thực JWT qua Authorization header

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    Tokens:
      description: Cấp access token và refresh token thành công
      headers:
        Cache-Control:
          schema:
            type: string
          example: no-store
      content:
        application/json:
          schema:
            type: object
            required: [access_token, refresh_token, token_type, expires_in]
            properties:
              access_token:
                type: string
              refresh_token:
                type: string
              token_type:
                type: string
                enum: [Bearer]
              expires_in:
                type: integer
                description: Thời gian hiệu lực của access token
                example: 900
    BadRequest:
      description: Thiếu dữ liệu, JSON sai hoặc ID không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_request
